name: CI

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'bin/**'
      - 'test/**'
      - 'release/**'
      - '.github/workflows/**'
      - 'atlas/**'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'bin/**'
      - 'test/**'
      - 'release/**'
      - '.github/workflows/**'
      - 'atlas/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]

    steps:
      - uses: actions/checkout@v7

      # Atlas needs Node 22 or later, so the check runs once, on the Node 20 cell,
      # before that cell's own Node setup.
      - name: Setup Node 22 for Atlas
        if: matrix.node == 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Atlas check
        if: matrix.node == 20
        run: npx --yes @dogfood-lab/atlas@1.21.0 check

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Smoke tests
        run: npm test

      - name: npm pack dry-run
        run: npm pack --dry-run

      - name: Verify CLI flags
        shell: bash
        run: |
          node bin/sovereign.js --version
          node bin/sovereign.js --path > /dev/null
          node bin/sovereign.js --help > /dev/null

      - name: Coverage (Node 20 only)
        if: matrix.node == 20
        run: npm run coverage

      - name: Upload coverage artifact
        if: matrix.node == 20
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
